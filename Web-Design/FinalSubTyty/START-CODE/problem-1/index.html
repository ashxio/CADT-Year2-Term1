<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Problem-1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind (Offline) -->
    <script src="../tailwind-browser.js"></script>
</head>

<body>
    <!-- Write your code here -->
    <div class="w-96 bg-white shadow p-4 mx-auto my-8" style="width:400px;">
        <header class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-full bg-gray-300"></span>
            <div class="flex flex-col">
                <span class="font-semibold">John Doe</span>
                <span class="text-xs text-gray-500">2 hrs ago</span>
            </div>
        </header>
        <div class="mt-4 mb-4 text-gray-800">
            This is a sample Facebook post layout designed using flexbox
        </div>
        <div class="w-full h-48 bg-gray-200 flex items-center justify-center mb-4">
        </div>
        <footer class="flex justify-between mt-4">
            <button class="flex items-center gap-1 px-3 py-1 rounded hover:bg-gray-100 transition" title="Like" aria-label="Like">
                👍 <span class="">Like</span>
            </button>
            <button class="flex items-center gap-1 px-3 py-1 rounded hover:bg-gray-100 transition" title="Comment" aria-label="Comment">
                💬 <span class="">Comment</span>
            </button>
            <button class="flex items-center gap-1 px-3 py-1 rounded hover:bg-gray-100 transition" title="Share" aria-label="Share">
                🔄 <span class="">Share</span>
            </button>
        </footer>
    </div>
</body>

</html>
