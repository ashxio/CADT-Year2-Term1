<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/component/header.css">
    <link rel="stylesheet" href="css/component/footer.css">
    <link rel="stylesheet" href="css/component/card.css">
    <link rel="stylesheet" href="css/TvNa/main.css">
    <title>TvNa</title>
</head>
<body>
    <div class="container">

        <header>
            <div class="logoAndMenu">
                <button class="menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="logo">
                    <img src="" alt="">
                    <h2>TvNa</h2>
                </div>
            </div>
            <div class="space"></div>
            <div class="containerButton">
                <div class="containerNav">
                    <nav>
                        <button class="nav">TvNa</button>
                        <button class="nav">Favourited</button>
                        <button class="nav">Community</button>
                        <button class="nav">About us</button>
                    </nav>
                </div>
                <div class="signinLogin">
                    <button class="signin">Sign in</button>
                </div>
            </div>
        </header>

        <div class="main">
            <h1>TvNa?</h1>
            <nav class="navbar">
                <ul>
                    <li><a href="#">TvNa</a></li>
                    <li><a href="#">DerLg</a></li>
                    <li><a href="#">NhamEy</a></li>
                </ul>
            </nav>
            <div class="slider">
                <div class="slide-track">
                    <img src="img/visitPhnomPenh.webp" alt="phnompenh">
                    <img src="img/museum.webp" alt="museum">
                    <img src="img/funmall.jpg" alt="funmall">
                </div>
            </div>
            <div class="content">
                <div class="derlg">
                    <h3>DerLg</h3>
                    <div id="derlgList"> </div>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer">
                <div class="logo">
                    <img src="" alt="">
                </div>
            </div>
            <h3>Facebook</h3>
            <h3>Instagram</h3>
            <h3>Telegram</h3>
            <h3>Contact</h3>
        </footer>
    </div>
<script type="module" src="js/script.js"></script>
</body>
</html>
